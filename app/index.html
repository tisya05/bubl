<!DOCTYPE html>
<!--
  Active theme is set on the <html> element below.
  To switch themes, change `data-theme` to any id defined in src/themes.ts.
  Color values per theme live in src/themes.css.
-->
<html lang="en" data-theme="navy-sherbet">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#252b61" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Explore your city, one little discovery at a time. Walk, pop a bubble, and meet the locals behind it." />
    <link rel="icon" type="image/png" sizes="32x32" href="/bubl/icons/icon-32.png?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/bubl/icons/icon-180.png?v=4" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="bubl" />
    <title>bubl · explore your city</title>
    <!--
      First-paint background, keyed to the data-theme attribute above.
      Without this the browser paints white until the CSS bundle arrives —
      a hard flash on the dark themes. Each value mirrors --color-background
      in src/styles.css (slate) / src/themes.css; keep them in sync when
      adding or editing themes.
    -->
    <style>
      html { background-color: #0a0a0a; color-scheme: dark; }
      html[data-theme="paper"] { background-color: #ffffff; color-scheme: light; }
      html[data-theme="navy-sherbet"] { background-color: #252b61; color-scheme: light; }
      /* Add one line per theme you create, mirroring its --color-background. */
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
